name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer tests
        run: sh tests/install_test.sh
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Skill lint
        run: python3 tests/lint_skills.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer tests (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_test.ps1; exit $LASTEXITCODE
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/install_test.ps1; exit $LASTEXITCODE
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Skill lint
        run: python tests/lint_skills.py
